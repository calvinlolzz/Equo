<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Equo 算好" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Equo 算好，用簡單的建立流程開始分帳。" />
  <link rel="manifest" href="./site.webmanifest" />
  <link rel="icon" href="./assets/icons/equo-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/equo-icon-512.png" />
  <title>Equo 算好</title>
  <style>
    /* Pizo Inspired Create Flow / liquid-glass / calm start */
    :root {
      --bg: #f6f7f2;
      --ink: #16252c;
      --muted: #6a777c;
      --line: rgba(22, 37, 44, .11);
      --green: #5f7f67;
      --green-dark: #314c3b;
      --leaf: #dce9df;
      --sky: #dfeaec;
      --cream: #fbfaf5;
      --glass: rgba(255, 255, 255, .64);
      --glass-strong: rgba(255, 255, 255, .82);
      --shadow: 0 26px 80px rgba(22, 37, 44, .14);
      --inner: inset 0 1px 0 rgba(255, 255, 255, .78), inset 0 -1px 0 rgba(22, 37, 44, .06);
      font-family: "Aptos", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 48% -8%, rgba(255, 255, 255, .95), transparent 30rem),
        linear-gradient(140deg, var(--bg), var(--sky) 58%, #f1eee6);
      overflow-x: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid rgba(95, 127, 103, .32);
      outline-offset: 3px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: 66vw;
      height: 30vh;
      left: 50%;
      top: 8%;
      transform: translateX(-50%) rotate(-7deg);
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 255, 255, .72), rgba(95, 127, 103, .2), rgba(89, 128, 139, .18));
      filter: blur(28px) saturate(1.2);
      animation: glassDrift 13s ease-in-out infinite alternate;
    }

    .ambient::after {
      top: auto;
      bottom: 4%;
      width: 78vw;
      transform: translateX(-50%) rotate(6deg);
      background: linear-gradient(90deg, rgba(245, 237, 220, .5), rgba(255, 255, 255, .58), rgba(95, 127, 103, .16));
      animation-delay: -5s;
      animation-duration: 16s;
    }

    .shell {
      min-height: 100dvh;
      width: 100%;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      overflow-x: clip;
    }

    .phone {
      width: min(100%, 430px);
      max-width: calc(100vw - 36px);
      min-height: min(760px, calc(100dvh - 40px));
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      animation: riseIn .42s ease both;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 900;
      background: linear-gradient(145deg, var(--green), #5b8a91);
      box-shadow: 0 14px 28px rgba(49, 76, 59, .2), var(--inner);
    }

    .brand strong {
      font-size: 22px;
      line-height: 1;
      letter-spacing: 0;
    }

    .panel {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, .78);
      background: linear-gradient(150deg, var(--glass-strong), rgba(255, 255, 255, .44));
      box-shadow: var(--shadow), var(--inner);
      backdrop-filter: blur(30px) saturate(1.32);
      -webkit-backdrop-filter: blur(30px) saturate(1.32);
      animation: cardIn .52s cubic-bezier(.16, 1, .3, 1) both;
    }

    .panel::after,
    .sheet-card::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(120deg, rgba(255,255,255,.76), transparent 36%, rgba(255,255,255,.2) 58%, transparent 78%),
        radial-gradient(120% 80% at 50% -16%, rgba(255,255,255,.5), transparent 58%);
      opacity: .7;
    }

    .panel > *,
    .sheet-card > * {
      position: relative;
      z-index: 1;
    }

    .empty-state {
      padding: 28px 24px 22px;
      text-align: center;
    }

    .illustration {
      width: min(240px, 72%);
      aspect-ratio: 1.18;
      margin: 0 auto 26px;
      position: relative;
    }

    .dish {
      position: absolute;
      inset: 20% 4% 7%;
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 36%, rgba(255,255,255,.9), rgba(255,255,255,.42) 40%, rgba(95,127,103,.16) 72%),
        var(--glass);
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: 0 24px 48px rgba(22,37,44,.1), var(--inner);
    }

    .bill {
      position: absolute;
      left: 26%;
      top: 0;
      width: 48%;
      height: 72%;
      border-radius: 20px;
      background: linear-gradient(180deg, #fff, #f4f7f2);
      box-shadow: 0 20px 46px rgba(22,37,44,.14), var(--inner);
      transform: rotate(-4deg);
    }

    .bill::before,
    .bill::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      height: 8px;
      border-radius: 999px;
      background: rgba(22, 37, 44, .12);
    }

    .bill::before {
      top: 34%;
    }

    .bill::after {
      top: 48%;
      right: 34%;
    }

    .coin {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--green-dark);
      font-weight: 900;
      background: linear-gradient(145deg, #eef5ea, #cfe2d2);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 14px 28px rgba(49,76,59,.16), var(--inner);
    }

    .coin.one {
      left: 8%;
      bottom: 12%;
    }

    .coin.two {
      right: 9%;
      bottom: 18%;
      transform: scale(.86);
    }

    .copy {
      display: grid;
      gap: 10px;
      margin-bottom: 26px;
    }

    .copy h1 {
      font-size: 25px;
      line-height: 1.16;
      letter-spacing: 0;
    }

    .copy p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .btn {
      width: 100%;
      min-height: 48px;
      border-radius: 16px;
      padding: 0 16px;
      font-weight: 850;
      transition: transform .16s ease, opacity .16s ease, box-shadow .16s ease;
    }

    .btn:active {
      transform: scale(.985);
    }

    .btn.primary {
      color: white;
      background: linear-gradient(145deg, var(--green), var(--green-dark));
      box-shadow: 0 18px 34px rgba(49,76,59,.24), var(--inner);
    }

    .btn.secondary {
      background: rgba(255,255,255,.54);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.78);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .42;
      transform: none;
    }

    .quiet-link {
      margin-top: 4px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
      font-weight: 760;
      text-decoration: underline;
      text-decoration-color: rgba(106, 119, 124, .28);
      text-underline-offset: 4px;
    }

    .group-ready {
      display: none;
      padding: 24px;
      gap: 18px;
    }

    .group-ready.active {
      display: grid;
    }

    .group-hero {
      min-height: 280px;
      display: grid;
      align-content: end;
      padding: 22px;
      border-radius: 24px;
      background:
        linear-gradient(160deg, rgba(255,255,255,.44), rgba(95,127,103,.14)),
        radial-gradient(circle at 80% 8%, rgba(255,255,255,.82), transparent 44%);
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
    }

    .group-hero .badge {
      justify-self: start;
      margin-bottom: 12px;
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(255,255,255,.58);
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 860;
    }

    .group-hero h1 {
      font-size: 32px;
      line-height: 1.08;
    }

    .next-step {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .ready-actions {
      display: grid;
      gap: 10px;
    }

    .members-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .member-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 8px 10px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .52);
      border: 1px solid rgba(255, 255, 255, .62);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    }

    .member-avatar {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(145deg, var(--green), #5b8a91);
      font-weight: 900;
    }

    .member-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 830;
    }

    .summary-section {
      display: grid;
      gap: 10px;
      padding-top: 2px;
    }

    .summary-title {
      color: var(--ink);
      font-size: 15px;
      font-weight: 880;
    }

    .summary-card {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .52);
      border: 1px solid rgba(255, 255, 255, .62);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    }

    .expense-row,
    .settlement-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 42px;
    }

    .expense-name,
    .settlement-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 820;
    }

    .expense-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .expense-amount,
    .settlement-amount {
      color: var(--green-dark);
      font-weight: 900;
      white-space: nowrap;
    }

    .empty-summary {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 18px;
      background: rgba(22,37,44,.32);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .sheet.open {
      display: flex;
    }

    .sheet-card {
      position: relative;
      width: min(100%, 430px);
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.78);
      background: linear-gradient(150deg, rgba(255,255,255,.9), rgba(255,255,255,.58));
      box-shadow: var(--shadow), var(--inner);
      backdrop-filter: blur(30px) saturate(1.32);
      -webkit-backdrop-filter: blur(30px) saturate(1.32);
      padding: 18px;
      animation: sheetUp .34s cubic-bezier(.16, 1, .3, 1) both;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .sheet-head h2 {
      font-size: 20px;
      line-height: 1.2;
    }

    .close {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: rgba(255,255,255,.62);
      font-size: 24px;
      line-height: 1;
    }

    .photo-pick {
      width: 112px;
      height: 112px;
      margin: 6px auto 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--green-dark);
      background: linear-gradient(145deg, #eef4ee, #d5e5da);
      border: 1px dashed rgba(49,76,59,.28);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
      font-weight: 900;
      font-size: 28px;
    }

    .form {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      min-height: 50px;
      border-bottom: 1px solid var(--line);
    }

    .field span {
      color: var(--ink);
      font-weight: 830;
    }

    input,
    select {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 12px 0;
      outline: 0;
    }

    input::placeholder {
      color: rgba(106,119,124,.72);
    }

    .sheet-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(18px);
      z-index: 30;
      width: min(360px, calc(100% - 36px));
      border-radius: 18px;
      padding: 12px 14px;
      text-align: center;
      color: var(--ink);
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 18px 44px rgba(22,37,44,.14), var(--inner);
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      font-weight: 820;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes glassDrift {
      from { translate: -1.5% -1%; }
      to { translate: 1.5% 1%; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(.985); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes sheetUp {
      from { opacity: 0; transform: translateY(32px) scale(.985); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @media (min-width: 760px) {
      .phone {
        width: min(430px, 100%);
      }
    }

    @media (max-width: 520px) {
      .shell {
        padding-left: 26px;
        padding-right: 26px;
      }

      .phone {
        max-width: calc(100vw - 52px);
      }

      .empty-state {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <main class="shell">
    <div class="phone pizo-inspired-create" data-flow="create-first-group">
      <header class="brand" aria-label="Equo 算好">
        <div class="brand-mark">E</div>
        <strong>Equo 算好</strong>
      </header>

      <section class="panel empty-state" id="empty-state" aria-labelledby="empty-title">
        <div class="illustration" aria-hidden="true">
          <div class="dish"></div>
          <div class="bill"></div>
          <div class="coin one">$</div>
          <div class="coin two">=</div>
        </div>
        <div class="copy">
          <h1 id="empty-title">先建立一個群組</h1>
          <p>不用先看帳本。建立群組後，再慢慢加入成員與第一筆支出。</p>
        </div>
        <div class="actions">
          <button class="btn primary" type="button" onclick="openGroupModal()">建立第一個群組</button>
          <button class="quiet-link" type="button" onclick="showToast('邀請碼流程之後再接上')">我有邀請碼</button>
        </div>
      </section>

      <section class="panel group-ready" id="group-ready" aria-labelledby="ready-title">
        <div class="group-hero">
          <span class="badge">已建立</span>
          <h1 id="ready-title">家庭日常</h1>
        </div>
        <p class="next-step">先加入一起分帳的人，再加入第一筆支出。Equo 會在需要時才顯示結算與提醒。</p>
        <ul class="members-list" id="members-list" aria-label="群組成員">
          <li class="member-row" id="empty-member-row">
            <span class="member-avatar" aria-hidden="true">＋</span>
            <span class="member-name">還沒有成員</span>
          </li>
        </ul>
        <div class="ready-actions">
          <button class="btn primary" type="button" onclick="openMemberModal()">加入成員</button>
          <button class="btn secondary" type="button" onclick="openExpenseModal()">新增第一筆支出</button>
          <button class="quiet-link" type="button" onclick="openGroupModal()">調整群組</button>
        </div>
        <section class="summary-section expense-summary" id="expense-summary" aria-labelledby="expense-summary-title">
          <h2 class="summary-title" id="expense-summary-title">最近支出</h2>
          <div class="summary-card">
            <div class="empty-summary" id="empty-expense-summary">新增第一筆支出後，這裡會顯示摘要。</div>
            <div class="expenses-list" id="expenses-list" aria-label="最近支出"></div>
          </div>
        </section>
        <section class="summary-section settlement-preview" id="settlement-preview" aria-labelledby="settlement-preview-title">
          <h2 class="summary-title" id="settlement-preview-title">結算預覽</h2>
          <div class="summary-card">
            <div class="empty-summary" id="empty-settlement-preview">有支出和成員後，Equo 會先顯示最簡單的結算方向。</div>
            <div id="settlement-result" aria-live="polite"></div>
          </div>
        </section>
      </section>
    </div>
  </main>

  <section class="sheet create-group-modal" id="group-modal" aria-modal="true" aria-label="建立群組">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2>建立群組</h2>
        <button class="close" type="button" onclick="closeGroupModal()" aria-label="關閉">×</button>
      </div>
      <form class="form" onsubmit="createGroup(event)">
        <div class="photo-pick" aria-hidden="true">＋</div>
        <label class="field">
          <span>名稱</span>
          <input id="group-name-input" autocomplete="off" placeholder="例如：日本旅遊" oninput="syncCreateButton()" />
        </label>
        <label class="field">
          <span>幣別</span>
          <select id="currency-picker">
            <option value="TWD">TWD</option>
            <option value="JPY">JPY</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
          </select>
        </label>
        <div class="sheet-actions">
          <button class="btn secondary" type="button" onclick="closeGroupModal()">取消</button>
          <button class="btn primary" id="create-group-button" type="submit" disabled>建立</button>
        </div>
      </form>
    </div>
  </section>

  <section class="sheet add-member-modal" id="member-modal" aria-modal="true" aria-label="加入成員">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2>加入成員</h2>
        <button class="close" type="button" onclick="closeMemberModal()" aria-label="關閉">×</button>
      </div>
      <form class="form" onsubmit="addMember(event)">
        <div class="photo-pick" aria-hidden="true">人</div>
        <label class="field">
          <span>名字</span>
          <input id="member-name-input" autocomplete="off" placeholder="例如：小美" />
        </label>
        <div class="sheet-actions">
          <button class="btn secondary" type="button" onclick="closeMemberModal()">取消</button>
          <button class="btn primary" type="submit">加入</button>
        </div>
      </form>
    </div>
  </section>

  <section class="sheet first-expense-modal" id="expense-modal" aria-modal="true" aria-label="新增第一筆支出">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2>第一筆支出</h2>
        <button class="close" type="button" onclick="closeExpenseModal()" aria-label="關閉">×</button>
      </div>
      <form class="form" onsubmit="saveExpense(event)">
        <label class="field">
          <span>項目</span>
          <input id="expense-name-input" autocomplete="off" placeholder="例如：晚餐" />
        </label>
        <label class="field">
          <span>金額</span>
          <input id="expense-amount-input" type="number" min="1" inputmode="decimal" placeholder="0" />
        </label>
        <div class="sheet-actions">
          <button class="btn secondary" type="button" onclick="closeExpenseModal()">稍後</button>
          <button class="btn primary" type="submit">加入</button>
        </div>
      </form>
    </div>
  </section>

  <div class="toast" id="toast-region" role="status" aria-live="polite"></div>

  <script>
    const groupModal = document.getElementById("group-modal");
    const memberModal = document.getElementById("member-modal");
    const expenseModal = document.getElementById("expense-modal");
    const emptyState = document.getElementById("empty-state");
    const groupReady = document.getElementById("group-ready");
    const groupNameInput = document.getElementById("group-name-input");
    const createGroupButton = document.getElementById("create-group-button");
    const readyTitle = document.getElementById("ready-title");
    const membersList = document.getElementById("members-list");
    const emptyMemberRow = document.getElementById("empty-member-row");
    const expensesList = document.getElementById("expenses-list");
    const settlementResult = document.getElementById("settlement-result");
    const emptyExpenseSummary = document.getElementById("empty-expense-summary");
    const emptySettlementPreview = document.getElementById("empty-settlement-preview");
    const toast = document.getElementById("toast-region");
    let toastTimer = 0;
    const members = [];
    const expenses = [];

    function openGroupModal() {
      groupModal.classList.add("open");
      groupNameInput.focus();
      syncCreateButton();
    }

    function closeGroupModal() {
      groupModal.classList.remove("open");
    }

    function syncCreateButton() {
      createGroupButton.disabled = groupNameInput.value.trim().length === 0;
    }

    function createGroup(event) {
      event.preventDefault();
      const name = groupNameInput.value.trim();
      if (!name) return;
      readyTitle.textContent = name;
      emptyState.style.display = "none";
      groupReady.classList.add("active");
      closeGroupModal();
      showToast("群組已建立");
    }

    function openMemberModal() {
      memberModal.classList.add("open");
      document.getElementById("member-name-input").focus();
    }

    function closeMemberModal() {
      memberModal.classList.remove("open");
    }

    function addMember(event) {
      event.preventDefault();
      const input = document.getElementById("member-name-input");
      const name = input.value.trim();
      if (!name) return;
      emptyMemberRow.hidden = true;
      const row = document.createElement("li");
      const avatar = document.createElement("span");
      const label = document.createElement("span");
      row.className = "member-row";
      row.setAttribute("aria-label", name);
      avatar.className = "member-avatar";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = name.slice(0, 1);
      label.className = "member-name";
      label.textContent = name;
      row.append(avatar, label);
      membersList.appendChild(row);
      members.push(name);
      input.value = "";
      closeMemberModal();
      showToast(`${name} 已加入`);
      renderExpenseSummary();
    }

    function openExpenseModal() {
      expenseModal.classList.add("open");
      document.getElementById("expense-name-input").focus();
    }

    function closeExpenseModal() {
      expenseModal.classList.remove("open");
    }

    function saveExpense(event) {
      event.preventDefault();
      const item = document.getElementById("expense-name-input").value.trim() || "第一筆支出";
      const amount = Number(document.getElementById("expense-amount-input").value || 0);
      expenses.push({ name: item, amount });
      closeExpenseModal();
      renderExpenseSummary();
      showToast(`${item} 已加入`);
    }

    function renderExpenseSummary() {
      expensesList.textContent = "";
      emptyExpenseSummary.hidden = expenses.length > 0;
      emptySettlementPreview.hidden = expenses.length > 0 && members.length > 0;

      expenses.slice(-2).forEach(expense => {
        const row = document.createElement("div");
        const text = document.createElement("div");
        const title = document.createElement("div");
        const meta = document.createElement("div");
        const amount = document.createElement("div");
        row.className = "expense-row";
        title.className = "expense-name";
        title.textContent = expense.name;
        meta.className = "expense-meta";
        meta.textContent = members.length ? `${members.length + 1} 人平均分` : "先加入成員再分攤";
        amount.className = "expense-amount";
        amount.textContent = `$${expense.amount.toLocaleString("zh-TW")}`;
        text.append(title, meta);
        row.append(text, amount);
        expensesList.appendChild(row);
      });

      settlementResult.textContent = "";
      if (expenses.length === 0 || members.length === 0) return;
      const latest = expenses[expenses.length - 1];
      const perPerson = Math.round(latest.amount / (members.length + 1));
      const row = document.createElement("div");
      const text = document.createElement("div");
      const amount = document.createElement("div");
      row.className = "settlement-row";
      text.className = "settlement-text";
      text.textContent = `${members[0]} 先付給你`;
      amount.className = "settlement-amount";
      amount.textContent = `$${perPerson.toLocaleString("zh-TW")}`;
      row.append(text, amount);
      settlementResult.appendChild(row);
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }

    [groupModal, memberModal, expenseModal].forEach(modal => {
      modal.addEventListener("click", event => {
        if (event.target === modal) modal.classList.remove("open");
      });
    });

    window.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeGroupModal();
        closeMemberModal();
        closeExpenseModal();
      }
    });
  </script>
</body>
</html>
