name: Database backup

# Why this exists: the Supabase project is on the free plan, which has NO
# automated backups — an accidental delete or a corrupt write is permanent.
# This takes a nightly logical dump, encrypts it, and keeps it as a workflow
# artifact until there is a reason to pay for Supabase PITR.
#
# Useful side effect: free-tier projects are paused after ~7 days of
# inactivity, and this connects daily. Treat that as a bonus, not a guarantee.

on:
  schedule:
    # 18:30 UTC = 02:30 Asia/Taipei — after the day's activity, before morning.
    - cron: "30 18 * * *"
  # So a backup can be taken on demand before anything risky (a migration, a
  # destructive fix) rather than waiting for the next night.
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Install PostgreSQL 17 client
        # The server is Postgres 17; pg_dump refuses to dump a server newer than
        # itself, and the runner ships an older client (16). Installing
        # postgresql-client-17 drops its binaries in a versioned dir that is NOT
        # ahead of the stock /usr/bin/pg_dump on PATH, so `pg_dump` still
        # resolves to 16 unless we prepend the 17 bindir — put it on GITHUB_PATH
        # so every later step gets the 17 client, and verify against the exact
        # binary (not whatever PATH currently points at).
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        env:
          # Supabase → Project Settings → Database → Connection string (URI).
          # Use the SESSION pooler or the direct connection; the transaction
          # pooler does not support the statements pg_dump issues.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ] || [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::SUPABASE_DB_URL and BACKUP_PASSPHRASE must both be set as repository secrets."
            exit 1
          fi

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "stamp=$STAMP" >> "$GITHUB_ENV"

          # --no-owner/--no-privileges so the dump restores into a fresh project
          # without Supabase's internal roles existing. Schema + data for the
          # app's own schema only; auth.* is Supabase-managed and is not ours to
          # restore. Errors are fatal (pipefail) so a partial dump can never be
          # uploaded and mistaken for a good one.
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --format=plain \
            --file="equo-$STAMP.sql"

          # Symmetric AES-256. The artifact is only visible to repo
          # collaborators, but it is every user's financial data — it should not
          # sit in CI storage as plaintext.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "equo-$STAMP.sql.gpg" \
            "equo-$STAMP.sql"

          rm -f "equo-$STAMP.sql"
          ls -lh "equo-$STAMP.sql.gpg"
          echo "backup_bytes=$(stat -c %s "equo-$STAMP.sql.gpg")" >> "$GITHUB_ENV"

      # Tell the database the backup ran. The admin console's health card reads
      # ops_heartbeats and shows how long ago this was - which is the only way
      # anyone finds out that a scheduled job quietly stopped firing. Recorded
      # after the dump and encryption succeed (pipefail aborts the step above
      # otherwise), so a stale timestamp always means a real failure.
      - name: Record backup heartbeat
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
            "select public.record_ops_heartbeat('db_backup', jsonb_build_object('bytes', ${{ env.backup_bytes }}::bigint, 'artifact', 'equo-db-${{ env.stamp }}', 'run_id', '${{ github.run_id }}'));"

      # Everything past its retention window, in one step and under one
      # heartbeat.
      #
      # Deliberately AFTER the dump, and inheriting the default "a failed step
      # aborts the job": these are DELETES, so they must not run on a night the
      # backup did not succeed. That ordering is the whole reason they live here
      # rather than in pg_cron, where a failure would go quiet inside the
      # database instead of turning this workflow red.
      #
      # Only READ notifications age out (an unread one has not done its job),
      # and only DEAD invites (revoked / used up / expired) — a live invite code
      # is never deleted however old, because the link is still sitting in
      # somebody's chat. See the migrations for the window on each table.
      #
      # The counts ride out as the heartbeat's detail, so the console can show
      # what last night actually removed.
      - name: Purge records past their retention window
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "
            select public.record_ops_heartbeat('retention', jsonb_build_object(
              'notifications',   public.purge_read_notifications(7),
              'scan_logs',       public.purge_receipt_scan_logs(365),
              'error_logs',      public.purge_error_logs(90),
              'client_requests', public.purge_client_requests(90),
              'invites',         public.purge_dead_invites(90),
              'error_alerts',    public.purge_error_alerts(90),
              'push_deliveries', public.purge_push_delivery_logs(90)
            ));"

      # 循環支出: turn every rule that has come due into a real expense.
      #
      # `if: always()` is the point of this step's existence being separate from
      # the ones above. This is the only USER-FACING thing the nightly run does
      # — somebody's rent showing up in their ledger — and it was silently
      # hostage to the backup: the steps run in sequence, so a failed dump
      # aborted the job and the rent simply never appeared, with the only signal
      # being an alert about backups. Creating an expense does not need a fresh
      # dump to be safe, so it runs either way and reports separately.
      #
      # Idempotent by construction (each period writes a deterministic
      # client_request_id, so a re-run returns the existing expense instead of
      # double-billing), which is what makes it safe to run unconditionally and
      # to re-run by hand.
      #
      # The function's own {created, failed, skipped} becomes the heartbeat
      # detail. `failed` is worth watching: a rule that raises is deactivated
      # with its error stored, so without this it would stop producing expenses
      # and nobody would know.
      - name: Materialise due recurring expenses
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c             "select public.record_ops_heartbeat('recurring_expenses', public.materialise_recurring_expenses());"

      - name: Upload encrypted dump
        uses: actions/upload-artifact@v4
        with:
          name: equo-db-${{ env.stamp }}
          path: equo-*.sql.gpg
          # Longer than the default 90 days is not possible on the free plan;
          # 30 keeps storage small while still covering "we broke it last week".
          retention-days: 30
          if-no-files-found: error
