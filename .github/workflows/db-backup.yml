name: Database backup

# Why this exists: the Supabase project is on the free plan, which has NO
# automated backups — an accidental delete or a corrupt write is permanent.
# This takes a nightly logical dump, encrypts it, and keeps it as a workflow
# artifact until there is a reason to pay for Supabase PITR.
#
# Useful side effect: free-tier projects are paused after ~7 days of
# inactivity, and this connects daily. Treat that as a bonus, not a guarantee.

on:
  schedule:
    # 18:30 UTC = 02:30 Asia/Taipei — after the day's activity, before morning.
    - cron: "30 18 * * *"
  # So a backup can be taken on demand before anything risky (a migration, a
  # destructive fix) rather than waiting for the next night.
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Install PostgreSQL 17 client
        # The server is Postgres 17; pg_dump refuses to dump a server newer than
        # itself, and the runner ships an older client (16). Installing
        # postgresql-client-17 drops its binaries in a versioned dir that is NOT
        # ahead of the stock /usr/bin/pg_dump on PATH, so `pg_dump` still
        # resolves to 16 unless we prepend the 17 bindir — put it on GITHUB_PATH
        # so every later step gets the 17 client, and verify against the exact
        # binary (not whatever PATH currently points at).
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        env:
          # Supabase → Project Settings → Database → Connection string (URI).
          # Use the SESSION pooler or the direct connection; the transaction
          # pooler does not support the statements pg_dump issues.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ] || [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::error::SUPABASE_DB_URL and BACKUP_PASSPHRASE must both be set as repository secrets."
            exit 1
          fi

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "stamp=$STAMP" >> "$GITHUB_ENV"

          # --no-owner/--no-privileges so the dump restores into a fresh project
          # without Supabase's internal roles existing. Schema + data for the
          # app's own schema only; auth.* is Supabase-managed and is not ours to
          # restore. Errors are fatal (pipefail) so a partial dump can never be
          # uploaded and mistaken for a good one.
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --format=plain \
            --file="equo-$STAMP.sql"

          # Symmetric AES-256. The artifact is only visible to repo
          # collaborators, but it is every user's financial data — it should not
          # sit in CI storage as plaintext.
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "equo-$STAMP.sql.gpg" \
            "equo-$STAMP.sql"

          rm -f "equo-$STAMP.sql"
          ls -lh "equo-$STAMP.sql.gpg"
          echo "backup_bytes=$(stat -c %s "equo-$STAMP.sql.gpg")" >> "$GITHUB_ENV"

      # Tell the database the backup ran. The admin console's health card reads
      # ops_heartbeats and shows how long ago this was - which is the only way
      # anyone finds out that a scheduled job quietly stopped firing. Recorded
      # after the dump and encryption succeed (pipefail aborts the step above
      # otherwise), so a stale timestamp always means a real failure.
      - name: Record backup heartbeat
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
            "select public.record_ops_heartbeat('db_backup', jsonb_build_object('bytes', ${{ env.backup_bytes }}::bigint, 'artifact', 'equo-db-${{ env.stamp }}', 'run_id', '${{ github.run_id }}'));"

      # Retention for the in-app inbox. Deliberately AFTER the dump, so anything
      # this removes is already inside tonight's backup — and here rather than
      # in pg_cron so a failure turns this workflow red instead of going quiet
      # inside the database. Only READ notifications age out; an unread one has
      # not done its job yet.
      - name: Purge read notifications older than 7 days
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c             "select public.purge_read_notifications(7);"

      # Retention for the receipt-scan usage ledger. Same placement and same
      # reasoning as the purge above: after the dump, and here rather than in
      # pg_cron so a failure is visible. A year is well past the console's
      # widest window (180 days), so nothing this removes was still readable.
      - name: Purge receipt scan logs older than a year
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c             "select public.purge_receipt_scan_logs(365);"

      # 循環支出: turn every rule that has come due into a real expense. Same
      # reasoning as the purge above for living here rather than in pg_cron —
      # a failure has to be visible. Idempotent by construction (each period
      # writes a deterministic client_request_id, so a re-run returns the
      # existing expense instead of double-billing), which is what makes it
      # safe to sit in a workflow that can be re-run by hand.
      - name: Materialise due recurring expenses
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
            "select public.materialise_recurring_expenses();"

      - name: Upload encrypted dump
        uses: actions/upload-artifact@v4
        with:
          name: equo-db-${{ env.stamp }}
          path: equo-*.sql.gpg
          # Longer than the default 90 days is not possible on the free plan;
          # 30 keeps storage small while still covering "we broke it last week".
          retention-days: 30
          if-no-files-found: error
