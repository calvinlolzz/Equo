<!doctype html><html><head><style>
body{margin:0;width:2500px;height:1686px;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#EEF1F6;
background:radial-gradient(circle at 10% 8%,rgba(77,227,166,.18),transparent 50%),radial-gradient(circle at 92% 6%,rgba(155,92,255,.18),transparent 50%),radial-gradient(circle at 50% 100%,rgba(61,139,255,.16),transparent 55%),linear-gradient(145deg,#07080D,#10121B 52%,#0B0D14)}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.t{position:relative;display:grid;place-content:center;justify-items:center;gap:30px;text-align:center}
.t::after{content:"";position:absolute;inset:28px;border-radius:56px;background:rgba(16,19,26,.8);border:4px solid #1C2030;z-index:-1}
.hl::after{background:linear-gradient(120deg,rgba(77,227,166,.22),rgba(61,139,255,.22)),rgba(16,19,26,.85);border-color:rgba(77,227,166,.45)}
.ic{width:170px;height:170px;border-radius:50px;display:grid;place-items:center;background:var(--bg)}
.ic svg{width:108px;height:108px;stroke:var(--c);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
h2{margin:0;font-size:104px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
p{margin:0;font-size:52px;font-weight:600;color:rgba(238,241,246,.62);white-space:nowrap}
</style></head><body><div class="grid">
<div class="t" style="--c:#4DE3A6;--bg:rgba(77,227,166,.14)"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></div><h2>本月收支</h2><p>支出・收入・預算</p></div>
<div class="t" style="--c:#4DE3A6;--bg:rgba(77,227,166,.14)"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></div><h2>記收入</h2><p>傳「收入 金額 項目」</p></div>
<div class="t hl" style="--c:#4DE3A6;--bg:rgba(77,227,166,.18)"><div class="ic"><svg viewBox="0 0 24 24"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></div><h2>開啟 Equo</h2><p>看明細、改帳、分帳</p></div>
<div class="t" style="--c:#FFB84D;--bg:rgba(255,184,77,.14)"><div class="ic"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></div><h2>復原上一筆</h2><p>30 分鐘內從 LINE 記的</p></div>
<div class="t" style="--c:#BEA0FF;--bg:rgba(155,92,255,.18)"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5h.01"/></svg></div><h2>使用說明</h2><p>記帳範例與所有指令</p></div>
<div class="t" style="--c:#7FB2FF;--bg:rgba(61,139,255,.16)"><div class="ic"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></div><h2>連結帳號</h2><p>第一次使用請先連結</p></div>
</div></body></html>
