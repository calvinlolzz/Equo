<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;width:1600px;height:800px;overflow:hidden;position:relative;font-family:"Noto Sans TC","Microsoft JhengHei","Segoe UI Emoji",sans-serif;color:#EEF1F6;
background:radial-gradient(circle at 10% 8%,rgba(77,227,166,.34),transparent 52%),radial-gradient(circle at 92% 10%,rgba(155,92,255,.34),transparent 52%),radial-gradient(circle at 60% 104%,rgba(61,139,255,.30),transparent 55%),linear-gradient(145deg,#07080D,#10121B 52%,#0B0D14)}
.left{position:absolute;left:96px;top:92px;width:700px}
.brand{display:flex;align-items:center;gap:20px;margin-bottom:26px}
.brand svg{width:68px;height:68px}
.brand span{font-size:44px;font-weight:800;letter-spacing:.08em}
h1{margin:0;font-size:108px;line-height:1.1;font-weight:800;letter-spacing:.01em;word-break:keep-all}
h1 em{font-style:normal;background:linear-gradient(100deg,#4DE3A6,#6EA8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:22px 0 0;font-size:38px;font-weight:600;color:rgba(238,241,246,.78)}
.chip{display:inline-block;margin-top:30px;padding:16px 34px;border-radius:999px;background:rgba(16,19,26,.9);border:2px solid #2a3046;font-size:34px;font-weight:700}
.chip b{color:#4DE3A6}
.mock{position:absolute;left:870px;top:24px;width:650px;height:740px;transform:rotate(-2.2deg);transform-origin:50% 50%}
.card{position:absolute;background:#12151F;border:2px solid #262C3F;border-radius:36px;box-shadow:0 34px 80px rgba(0,0,0,.55)}
.front{overflow:hidden}
.back{left:120px;top:478px;width:500px;padding:50px 30px 22px;transform:rotate(2.4deg)}
.front{left:96px;top:100px;width:536px;padding:28px 32px 26px}
.bubble{position:absolute;right:28px;top:0;padding:16px 36px;border-radius:40px 40px 8px 40px;background:#06C755;color:#fff;font-size:46px;font-weight:700;box-shadow:0 14px 34px rgba(6,199,85,.35)}
.time{position:absolute;right:306px;top:32px;font-size:22px;color:rgba(238,241,246,.5)}
.bot{position:absolute;left:0;top:104px;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 30% 20%,#153a30,#07100d);border:2px solid #2a3046;display:grid;place-items:center}
.bot svg{width:46px;height:46px}
.strip{display:flex;height:6px;margin:-28px -32px 22px;border-radius:36px 36px 0 0;overflow:hidden}
.strip i{flex:1}
.hd{display:flex;align-items:center;justify-content:space-between;font-size:23px;font-weight:700;color:#9AA3B5}
.hd small{font-size:22px;color:#9AA3B5;font-weight:500}
.main{display:flex;align-items:center;gap:18px;margin-top:20px}
.emo{width:80px;height:80px;border-radius:24px;display:grid;place-items:center;font-size:46px;background:#3B2C2E;flex:0 0 auto}
.ttl b{display:block;font-size:34px;font-weight:800;line-height:1.15}
.ttl span{font-size:22px;color:#9AA3B5;font-weight:500}
.amt{margin-top:18px;font-size:72px;line-height:1;font-weight:800;letter-spacing:-.01em}
.hr{height:2px;background:#262C3F;margin:20px 0 18px}
.row{display:flex;align-items:baseline;justify-content:space-between;font-size:22px;color:#9AA3B5;font-weight:600}
.row b{font-size:30px;color:#EEF1F6;font-weight:800}
.bar{height:10px;border-radius:5px;background:#262C3F;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:#4DE3A6}
.note{display:flex;justify-content:space-between;margin-top:10px;font-size:20px;color:#9AA3B5;font-weight:500}
.note b{color:#4DE3A6;font-weight:800}
.cat{margin-top:12px}
.cat .l{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:600}
.cat .l u{text-decoration:none;font-size:26px}
.cat .l span{flex:1}
.cat .l b{font-weight:800}
.cat .b{height:7px;border-radius:4px;background:#262C3F;margin-top:8px;overflow:hidden}
.cat .b i{display:block;height:100%;border-radius:4px}
.back .hd{font-size:22px}
</style></head><body>
<div class="left">
  <div class="brand"><svg viewBox="108 108 296 296"><path d="M233 365 A111 111 0 0 1 233 147" fill="none" stroke="#6de2b8" stroke-width="54" stroke-linecap="round"/><path d="M279 147 A111 111 0 0 1 279 365" fill="none" stroke="#ffd67a" stroke-width="54" stroke-linecap="round"/></svg><span>Equo</span></div>
  <h1>自己的錢<br><em>記清楚</em></h1>
  <p class="sub">在 LINE 傳一句話，就記進你的個人帳本</p>
  <div class="chip">試試傳「<b>早餐 60</b>」</div>
</div>
<div class="mock">
  <div class="card back">
    <div class="cat"><div class="l"><u>🍱</u><span>餐飲</span><b>$1,450</b></div><div class="b"><i style="width:62%;background:#F0885A"></i></div></div>
    <div class="cat"><div class="l"><u>🚇</u><span>交通</span><b>$520</b></div><div class="b"><i style="width:36%;background:#5B9BF0"></i></div></div>
    <div class="cat"><div class="l"><u>🎬</u><span>娛樂</span><b>$190</b></div><div class="b"><i style="width:14%;background:#F2B84B"></i></div></div>
  </div>
  <div class="time">10:24</div>
  <div class="bubble">早餐 60</div>
  <div class="bot"><svg viewBox="108 108 296 296"><path d="M233 365 A111 111 0 0 1 233 147" fill="none" stroke="#6de2b8" stroke-width="54" stroke-linecap="round"/><path d="M279 147 A111 111 0 0 1 279 365" fill="none" stroke="#ffd67a" stroke-width="54" stroke-linecap="round"/></svg></div>
  <div class="card front">
    <div class="strip"><i style="background:#4DE3A6"></i><i style="background:#6EA8FF"></i><i style="background:#BEA0FF"></i></div>
    <div class="hd"><span>已記下支出</span><small>10月3日</small></div>
    <div class="main"><div class="emo">🍱</div><div class="ttl"><b>早餐</b><span>餐飲</span></div></div>
    <div class="amt">$60</div>
    <div class="hr"></div>
    <div class="row"><span>本月支出</span><b>$2,340</b></div>
    <div class="bar"><i style="width:16%"></i></div>
    <div class="note"><span>預算 $15,000</span><b>還剩 $12,660</b></div>
  </div>
</div>
</body></html>
