<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Equo — 記帳與分帳</title>
    <meta name="description" content="Equo 讓你記下自己的收支，也和朋友、室友、旅伴輕鬆分帳：自動算出誰欠誰、一鍵結清，你在群組分到的那份也會算進個人帳本。" />
    <link rel="canonical" href="https://equo-mu.vercel.app/" />

    <!-- Open Graph / social share cards. Crawlers require ABSOLUTE image URLs,
         and most of them never re-fetch, so the dimensions are declared too.
         Equo spreads by people dropping a group link into a chat — this card is
         what they see, so it is a real 1200×630 image, not the square icon. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Equo" />
    <meta property="og:title" content="Equo — 記帳與分帳" />
    <meta property="og:description" content="記下自己的收支，也和朋友、室友、旅伴輕鬆分帳：自動算出誰欠誰、一鍵結清，你在群組分到的那份也會算進個人帳本。" />
    <meta property="og:url" content="https://equo-mu.vercel.app/" />
    <meta property="og:image" content="https://equo-mu.vercel.app/icons/equo-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Equo — 和朋友、室友、旅伴輕鬆分帳" />
    <meta property="og:locale" content="zh_TW" />
    <!-- The app renders in English for an English reader, but every visitor is
         served this one document, so the card above is the 繁體中文 one. This
         says the page exists in English too; making the card itself follow the
         reader would take locale negotiation on the HTML, which is a server
         change and not a tag. -->
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Equo — 記帳與分帳" />
    <meta name="twitter:description" content="記下自己的收支，也和朋友、室友、旅伴輕鬆分帳：自動算出誰欠誰、一鍵結清，你在群組分到的那份也會算進個人帳本。" />
    <meta name="twitter:image" content="https://equo-mu.vercel.app/icons/equo-og.png" />
    <meta name="twitter:image:alt" content="Equo — 和朋友、室友、旅伴輕鬆分帳" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%230c1613'/%3E%3Cpath d='M233 365 A111 111 0 0 1 233 147' fill='none' stroke='%236de2b8' stroke-width='54' stroke-linecap='round'/%3E%3Cpath d='M279 147 A111 111 0 0 1 279 365' fill='none' stroke='%23ffd67a' stroke-width='54' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="icon" type="image/svg+xml" href="/icons/equo-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#07080D" />
    <!-- Which commit this bundle was built from, so a deploy can be verified
         from the outside: the smoke script reads it to tell "the site is up"
         apart from "my commit is live" (the UI markers it checks are stable
         copy, so an older deployment passes them identically). Vite fills this
         from VITE_COMMIT_SHA, which vercel.json maps from VERCEL_GIT_COMMIT_SHA.
         A local `vite build` leaves the %VITE_% placeholder as-is, and the smoke
         script treats anything that is not a hex SHA as "unstamped". -->
    <meta name="equo-commit" content="%VITE_COMMIT_SHA%" />
    <!-- iOS ignores the manifest's icons and reads this one; 180² is the size
         it actually wants (a 512² gets downscaled on every home screen). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/equo-apple-touch-180.png" />
    <!-- The standards-track name; Chrome warns that the apple-* one below is
         deprecated, but iOS Safari still only honours its own, so both stay. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Equo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Launch screen. Inline on purpose: this has to paint from the HTML alone,
         because the whole point is the stretch BEFORE the entry chunk has been
         fetched, parsed and run — the React tree (skeletons included) cannot
         cover that, and what was there instead was a flat empty page.

         Held to the brand's own colour rather than the day/night theme, in both
         senses deliberately: the theme lives in localStorage and the CSP here is
         `script-src 'self'` with no inline scripts to read it before paint, and
         a launch screen conventionally *is* fixed-brand — this matches
         background_color in site.webmanifest, which is exactly what Android
         already shows when the installed app is opened.

         pointer-events:none throughout, so the one failure mode that would
         matter — a splash that never lifts — degrades to an invisible overlay
         rather than one that eats every tap. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        /* Mark over indicator, centred as a pair. align-content as well as
           place-items: with two children the two auto rows stretch to the full
           height by default and each child centres inside its own half, which
           puts the indicator down by the home bar instead of under the mark. */
        align-content: center;
        gap: clamp(14px, 3.4vh, 22px);
        /* The app's own night background, hard-coded.
           Flat black read as a screen that had not come on yet - which is what
           the black-screen reports were. This is the same recipe as `body` in
           app-base.css (the aurora field: green / purple / blue radial blobs
           over the page gradient), so lifting the cover reveals the same
           field rather than cutting from one dark to another. Hard-coded
           rather than var(--page-*): those live in the stylesheet this is
           meant to paint without. Mirrored by background_color in
           site.webmanifest, which is what Android shows before this HTML
           exists. */
        background:
          radial-gradient(circle at 12% 8%, rgba(77, 227, 166, 0.2), transparent 55%),
          radial-gradient(circle at 88% 6%, rgba(155, 92, 255, 0.2), transparent 55%),
          radial-gradient(circle at 50% 92%, rgba(61, 139, 255, 0.16), transparent 55%),
          linear-gradient(145deg, #07080D 0%, #10121B 52%, #0B0D14 100%);
        pointer-events: none;
        /* Backstop for "the module never ran at all": give up and get out of
           the way rather than sitting on a dead page forever. */
        animation: equo-splash-giveup 0s linear 12s forwards;
      }

      /* Scales with the screen rather than sitting at one pixel size: a fixed
         mark that reads right on a 375px phone is a stamp on a tablet. Bounded
         at both ends, and taken from the SHORTER axis (min of vw/vh) so landscape
         doesn't blow it up past the viewport height. */
      #app-splash svg {
        width: clamp(112px, min(34vw, 24vh), 168px);
        height: clamp(112px, min(34vw, 24vh), 168px);
      }

      /* The mark IS the spinner, once it has finished being drawn: two arcs
         with two gaps, turning. The plate behind them stays put - a rotating
         rounded square is a box tumbling, not a thing loading, which is why
         this wraps the paths and not the whole svg. transform-box is the SVG
         default here, stated so the origin below is obviously viewBox units. */
      #app-splash .splash-ring {
        transform-box: view-box;
        transform-origin: 256px 256px;
        animation: equo-splash-spin 1.6s linear 1.15s infinite;
      }

      /* The two arcs of the Equo mark, drawn on. 307 is the measured path length
         (getTotalLength), not an eyeballed round number: each arc looks like a
         semicircle but isn't — its chord is 218 against a diameter of 222, so it
         subtends 158°, and r × θ = 111 × 2.763 ≈ 306.5. Rounding this up to a
         semicircle's 349 would leave the mark finished before the animation was,
         with the tail of the duration spent drawing nothing. */
      #app-splash path {
        fill: none;
        stroke-width: 54;
        stroke-linecap: round;
        stroke-dasharray: 307;
        stroke-dashoffset: 307;
        /* Ease-in-out, not the sheet-arrival curve used elsewhere in the app:
           that one is deliberately front-loaded, which is right for a panel
           flying in and wrong for a stroke being drawn — it put three quarters
           of the line down in the first fifth of the time and read as a snap.
           This spreads the motion, so it looks like it is being written. */
        animation: equo-splash-draw 0.9s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }

      /* Named, like Pizo's. A mark on its own is a shape somebody has to
         recognise; the name is what makes this read as "Equo is opening"
         rather than as a page that failed to load. Deliberately no webfont:
         this paints from the HTML alone, so it takes what the device has. */
      #app-splash .splash-wordmark {
        color: #f7fbf8;
        font: 800 clamp(25px, 7vw, 33px) / 1 Inter, "Noto Sans TC", system-ui, sans-serif;
        letter-spacing: -0.01em;
        opacity: 0;
        animation: equo-splash-word-in 420ms ease-out 320ms forwards;
      }

      #app-splash .splash-arc-mint {
        stroke: #4DE3A6;
      }

      /* Staggered, so the two halves arrive one after the other rather than as
         one shape — which is the mark's whole idea. */
      #app-splash .splash-arc-gold {
        stroke: #3D8BFF;
        animation-delay: 0.2s;
      }

      /* Says "loading", which the mark alone does not.
         On this screen the entry bundle is the wait — 136 kB over whatever
         connection the phone has — and what covered it was a small mark on a
         near-black field breathing at 4.5%. That reads as a stalled black
         screen, which is what it kept being reported as.

         Delayed by 900ms on purpose: a load that finishes before then never
         shows this at all, so a fast open stays a clean flash of the mark
         rather than gaining a progress bar it did not need. */
      #app-splash .splash-progress {
        width: clamp(88px, 24vw, 132px);
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.09);
        opacity: 0;
        animation: equo-splash-progress-in 400ms ease-out 900ms forwards;
      }

      /* Indeterminate, and honestly so: nothing here knows how far along the
         download is, and a bar that invents a percentage is worse than one that
         only says "still going". */
      #app-splash .splash-progress span {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4DE3A6, #3D8BFF);
        /* -100% to 223%: translateX is a share of the SPAN's own width, so
           carrying its near edge across the full track takes 100/45 of it =
           222.2%, rounded UP - at 222% the bar parks a hair short of the end
           instead of leaving. Both ends clear the track, so it passes through
           rather than bouncing off. */
        animation: equo-splash-shuttle 1.25s cubic-bezier(0.65, 0, 0.35, 1) 900ms infinite;
      }

      @keyframes equo-splash-progress-in {
        to {
          opacity: 1;
        }
      }

      @keyframes equo-splash-shuttle {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(223%);
        }
      }

      /* Duration mirrored by FADE_MS in appSplash.ts — change both together. */
      #app-splash.is-ready {
        animation: none;
        opacity: 0;
        transform: scale(1.04);
        transition:
          opacity 300ms ease,
          transform 300ms ease;
      }

      @keyframes equo-splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes equo-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes equo-splash-word-in {
        to {
          opacity: 1;
        }
      }

      @keyframes equo-splash-giveup {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-ring,
        #app-splash path {
          animation: none;
        }
        #app-splash .splash-wordmark {
          animation: none;
          opacity: 1;
        }
        /* Keep a sign of life without anything travelling across the screen:
           the whole track, dimming in and out. Somebody who asked for less
           motion still needs to be able to tell loading from hung. */
        #app-splash .splash-progress span {
          width: 100%;
          animation: equo-splash-dim 1.8s ease-in-out 900ms infinite;
        }
        #app-splash path {
          stroke-dashoffset: 0;
        }
        #app-splash.is-ready {
          transform: none;
          transition: opacity 120ms linear;
        }
      }

      @keyframes equo-splash-dim {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 0.75;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="Equo 載入中">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="512" height="512" rx="116" fill="#0c1613" />
        <g class="splash-ring">
          <path class="splash-arc-mint" d="M233 365 A111 111 0 0 1 233 147" />
          <path class="splash-arc-gold" d="M279 147 A111 111 0 0 1 279 365" />
        </g>
      </svg>
      <div class="splash-wordmark" aria-hidden="true">Equo</div>
      <div class="splash-progress" aria-hidden="true"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
