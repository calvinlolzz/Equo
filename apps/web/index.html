<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Equo — 輕鬆分帳</title>
    <meta name="description" content="Equo 讓你和朋友、室友、旅伴輕鬆記帳分帳，自動算出誰欠誰、一鍵結清。" />
    <link rel="canonical" href="https://equo-mu.vercel.app/" />

    <!-- Open Graph / social share cards. Crawlers require ABSOLUTE image URLs,
         and most of them never re-fetch, so the dimensions are declared too.
         Equo spreads by people dropping a group link into a chat — this card is
         what they see, so it is a real 1200×630 image, not the square icon. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Equo" />
    <meta property="og:title" content="Equo — 輕鬆分帳" />
    <meta property="og:description" content="和朋友、室友、旅伴輕鬆記帳分帳，自動算出誰欠誰、一鍵結清。" />
    <meta property="og:url" content="https://equo-mu.vercel.app/" />
    <meta property="og:image" content="https://equo-mu.vercel.app/icons/equo-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Equo — 和朋友、室友、旅伴輕鬆分帳" />
    <meta property="og:locale" content="zh_TW" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Equo — 輕鬆分帳" />
    <meta name="twitter:description" content="和朋友、室友、旅伴輕鬆記帳分帳，自動算出誰欠誰、一鍵結清。" />
    <meta name="twitter:image" content="https://equo-mu.vercel.app/icons/equo-og.png" />
    <meta name="twitter:image:alt" content="Equo — 和朋友、室友、旅伴輕鬆分帳" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%230c1613'/%3E%3Cpath d='M233 365 A111 111 0 0 1 233 147' fill='none' stroke='%236de2b8' stroke-width='54' stroke-linecap='round'/%3E%3Cpath d='M279 147 A111 111 0 0 1 279 365' fill='none' stroke='%23ffd67a' stroke-width='54' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="icon" type="image/svg+xml" href="/icons/equo-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#07110f" />
    <!-- Which commit this bundle was built from, so a deploy can be verified
         from the outside: the smoke script reads it to tell "the site is up"
         apart from "my commit is live" (the UI markers it checks are stable
         copy, so an older deployment passes them identically). Vite fills this
         from VITE_COMMIT_SHA, which vercel.json maps from VERCEL_GIT_COMMIT_SHA.
         A local `vite build` leaves the %VITE_% placeholder as-is, and the smoke
         script treats anything that is not a hex SHA as "unstamped". -->
    <meta name="equo-commit" content="%VITE_COMMIT_SHA%" />
    <!-- iOS ignores the manifest's icons and reads this one; 180² is the size
         it actually wants (a 512² gets downscaled on every home screen). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/equo-apple-touch-180.png" />
    <!-- The standards-track name; Chrome warns that the apple-* one below is
         deprecated, but iOS Safari still only honours its own, so both stay. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Equo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Launch screen. Inline on purpose: this has to paint from the HTML alone,
         because the whole point is the stretch BEFORE the entry chunk has been
         fetched, parsed and run — the React tree (skeletons included) cannot
         cover that, and what was there instead was a flat empty page.

         Held to the brand's own colour rather than the day/night theme, in both
         senses deliberately: the theme lives in localStorage and the CSP here is
         `script-src 'self'` with no inline scripts to read it before paint, and
         a launch screen conventionally *is* fixed-brand — this matches
         background_color in site.webmanifest, which is exactly what Android
         already shows when the installed app is opened.

         pointer-events:none throughout, so the one failure mode that would
         matter — a splash that never lifts — degrades to an invisible overlay
         rather than one that eats every tap. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #07110f;
        pointer-events: none;
        /* Backstop for "the module never ran at all": give up and get out of
           the way rather than sitting on a dead page forever. */
        animation: equo-splash-giveup 0s linear 12s forwards;
      }

      /* Scales with the screen rather than sitting at one pixel size: a fixed
         mark that reads right on a 375px phone is a stamp on a tablet. Bounded
         at both ends, and taken from the SHORTER axis (min of vw/vh) so landscape
         doesn't blow it up past the viewport height. */
      #app-splash svg {
        width: clamp(112px, min(34vw, 24vh), 168px);
        height: clamp(112px, min(34vw, 24vh), 168px);
        /* Starts after the draw finishes, so a slow load keeps breathing
           instead of freezing on a finished mark. */
        animation: equo-splash-breathe 3s ease-in-out 1.35s infinite;
      }

      /* The two arcs of the Equo mark, drawn on. 307 is the measured path length
         (getTotalLength), not an eyeballed round number: each arc looks like a
         semicircle but isn't — its chord is 218 against a diameter of 222, so it
         subtends 158°, and r × θ = 111 × 2.763 ≈ 306.5. Rounding this up to a
         semicircle's 349 would leave the mark finished before the animation was,
         with the tail of the duration spent drawing nothing. */
      #app-splash path {
        fill: none;
        stroke-width: 54;
        stroke-linecap: round;
        stroke-dasharray: 307;
        stroke-dashoffset: 307;
        /* Ease-in-out, not the sheet-arrival curve used elsewhere in the app:
           that one is deliberately front-loaded, which is right for a panel
           flying in and wrong for a stroke being drawn — it put three quarters
           of the line down in the first fifth of the time and read as a snap.
           This spreads the motion, so it looks like it is being written. */
        animation: equo-splash-draw 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }

      #app-splash .splash-arc-mint {
        stroke: #6de2b8;
      }

      /* Staggered, so the two halves arrive one after the other rather than as
         one shape — which is the mark's whole idea. */
      #app-splash .splash-arc-gold {
        stroke: #ffd67a;
        animation-delay: 0.2s;
      }

      /* Duration mirrored by FADE_MS in appSplash.ts — change both together. */
      #app-splash.is-ready {
        animation: none;
        opacity: 0;
        transform: scale(1.04);
        transition:
          opacity 300ms ease,
          transform 300ms ease;
      }

      @keyframes equo-splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes equo-splash-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.045);
        }
      }

      @keyframes equo-splash-giveup {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash svg,
        #app-splash path {
          animation: none;
        }
        #app-splash path {
          stroke-dashoffset: 0;
        }
        #app-splash.is-ready {
          transform: none;
          transition: opacity 120ms linear;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="Equo 載入中">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="512" height="512" rx="116" fill="#0c1613" />
        <path class="splash-arc-mint" d="M233 365 A111 111 0 0 1 233 147" />
        <path class="splash-arc-gold" d="M279 147 A111 111 0 0 1 279 365" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
